# Un tag ordinaire crée un brouillon. Le sujet « Publier Tasogare <version> »
# sur un tag annoté rend la release publique après les vérifications.
# Le tag doit être identique à la version de manifest.json.
# Les notes de release viennent de la section du même nom dans CHANGELOG.md.
name: Release Obsidian theme

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Vérifier que le tag correspond au manifeste
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(jq -r .version manifest.json)"
          test "$tag" = "$version" || { echo "Le tag $tag ne correspond pas à la version $version du manifeste."; exit 1; }

      - name: Vérifier le thème
        run: |
          python3 outils/verifier.py
          python3 -m unittest discover -s outils -p 'test_*.py'

      - name: Extraire les notes de CHANGELOG.md
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          awk -v v="## $tag" '$0 == v {dedans=1; next} /^## / {dedans=0} dedans' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md n'a pas de section ## $tag."; exit 1; }

      - name: Créer la release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          mode=(--draft)
          subject="$(git for-each-ref --format='%(contents:subject)' "refs/tags/$tag")"
          if [[ "$(git cat-file -t "refs/tags/$tag")" == tag && "$subject" == "Publier Tasogare $tag" ]]; then
            mode=()
          fi
          gh release create "$tag" \
            --title="$tag" \
            --notes-file notes.md \
            --verify-tag \
            "${mode[@]}" \
            manifest.json theme.css

      - name: Actualiser les fichiers et notes de la version précédente
        if: github.ref == 'refs/tags/1.9.1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk '$0 == "## 1.9.0" {dedans=1; next} /^## / {dedans=0} dedans' CHANGELOG.md > notes-precedentes.md
          test -s notes-precedentes.md
          gh release edit 1.9.0 --notes-file notes-precedentes.md
          gh release upload 1.9.0 theme.css --clobber
